name: Finalize capability-aware hff cp

on:
  push:
    paths:
      - .github/workflows/finalize-hff-capability-aware-cp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hff = Path('bin/hff.py')
          text = hff.read_text(encoding='utf-8')

          parser_start = text.index('def parse_hf_uri(uri: str):\n')
          parser_end = text.index('\n\ndef ensure_dir_ops(', parser_start)
          parser = '''def parse_hf_uri(uri: str):
              """Parse an hf:// repository URI while preserving directory intent."""
              raw = (uri or "").strip()
              if not raw.startswith("hf://"):
                  return None

              parts = raw[5:].split("/")
              if len(parts) < 3:
                  die(
                      "cp: invalid Hugging Face URI; expected "
                      "hf://datasets/OWNER/REPO/path or hf://OWNER/REPO/path",
                      1,
                  )

              first = parts[0].lower()
              if first in {"dataset", "datasets", "model", "models"}:
                  if len(parts) < 4:
                      die("cp: Hugging Face URI is missing owner, repo, or path", 1)
                  repo_type = "dataset" if first in {"dataset", "datasets"} else "model"
                  owner, repo_name = parts[1:3]
                  path_parts = parts[3:]
              else:
                  repo_type = "model"
                  owner, repo_name = parts[:2]
                  path_parts = parts[2:]

              path_in_repo = normalize_path("/".join(path_parts))
              if not owner or not repo_name or not path_in_repo:
                  die("cp: Hugging Face URI is missing owner, repo, or file path", 1)
              if has_glob(path_in_repo):
                  die("cp: hf:// sources do not support globs", 1)

              return f"{owner}/{repo_name}", repo_type, path_in_repo, has_trailing_slash(raw)


          def make_hf_uri(repo: str, repo_type: str, path: str, trailing_slash: bool = False) -> str:
              prefix = "hf://datasets/" if repo_type == "dataset" else "hf://"
              uri = f"{prefix}{repo}/{normalize_path(path)}"
              if trailing_slash and not uri.endswith("/"):
                  uri += "/"
              return uri


          def supports_server_side_copy(api_: HfApi) -> bool:
              return callable(getattr(api_, "copy_files", None))
          '''
          text = text[:parser_start] + parser + text[parser_end:]

          cp_start = text.index('def cmd_cp(args) -> None:\n')
          cp_end = text.index('\n\ndef cmd_get(args) -> None:\n', cp_start)
          cp_impl = '''def cmd_cp(args) -> None:
              """Copy a local file or an hf:// source into the configured repository."""
              src_raw = (args.src or "").strip()
              if not src_raw:
                  die("cp: src required")

              remote = parse_hf_uri(src_raw)
              if remote is None:
                  args.local = [src_raw]
                  return cmd_put(args)

              tok = need_token()
              source_repo, source_type, source_path, source_is_dir = remote
              dst_arg = (args.dst or "").strip()
              dst_is_dir = has_trailing_slash(dst_arg)
              dst_path = normalize_path(dst_arg)
              if not dst_path:
                  die("cp: dst required")

              if source_is_dir:
                  destination_path = dst_path
                  destination_is_dir = dst_is_dir
              elif dst_is_dir:
                  destination_path = f"{dst_path}/{Path(source_path).name}"
                  destination_is_dir = False
              else:
                  destination_path = dst_path
                  destination_is_dir = False

              destination_uri = make_hf_uri(
                  args.repo,
                  args.type,
                  destination_path,
                  trailing_slash=destination_is_dir,
              )
              a = api(tok)

              if args.local_transfer:
                  if source_is_dir:
                      die("cp: --local currently supports only single-file hf:// sources", 1)
                  print(f"[hff] Local transfer: {src_raw} -> {destination_uri}", file=sys.stderr)
                  try:
                      cached = _hf_download(
                          source_repo,
                          source_type,
                          source_path,
                          tok,
                          cache_dir=args.cache_dir or None,
                      )
                  except Exception as e:
                      die(f"cp: local download failed for {src_raw}: {e}", 1)
                  try:
                      a.upload_file(
                          path_or_fileobj=str(cached),
                          path_in_repo=destination_path,
                          repo_id=args.repo,
                          repo_type=args.type,
                          commit_message=args.message or f"cp {src_raw} -> {destination_path} via local transfer",
                      )
                  except Exception as e:
                      die(f"cp: local upload failed to {destination_uri}: {e}", 1)
                  print(destination_uri)
                  return

              if not supports_server_side_copy(a):
                  try:
                      import huggingface_hub
                      version = getattr(huggingface_hub, "__version__", "unknown")
                  except Exception:
                      version = "unknown"
                  die(
                      "cp: server-side repository copy is unavailable with "
                      f"huggingface-hub {version}. Re-run with --local for a single-file "
                      "download/upload transfer.",
                      1,
                  )

              try:
                  a.copy_files(src_raw, destination_uri)
              except Exception as e:
                  hint = ""
                  if not source_is_dir:
                      hint = " Re-run with --local to download and upload the file through this machine."
                  die(f"cp: server-side copy failed: {e}.{hint}", 1)

              print(destination_uri)
          '''
          text = text[:cp_start] + cp_impl + text[cp_end:]

          cli_start = text.index('    sp = sub.add_parser("cp")\n')
          cli_end = text.index('\n    sp = sub.add_parser("get")\n', cli_start)
          cli = '''    sp = sub.add_parser("cp")
              sp.add_argument("src", help="local file or hf:// repository URI")
              sp.add_argument("dst")
              sp.add_argument("-m", "--message", default="")
              sp.add_argument("--cache-dir", default="")
              sp.add_argument(
                  "--local",
                  dest="local_transfer",
                  action="store_true",
                  help="for one hf:// file, download then upload instead of using server-side copy",
              )
              sp.set_defaults(fn=cmd_cp)
          '''
          text = text[:cli_start] + cli + text[cli_end:]
          hff.write_text(text, encoding='utf-8')

          helper = Path('helpers_shell.sh')
          helper_text = helper.read_text(encoding='utf-8')
          start = helper_text.index('# -------- venv bootstrap (LAN-friendly) --------\n')
          fn_start = helper_text.index('ensure_hf_tools_venv() {\n', start)
          pos = fn_start
          depth = 0
          end = None
          for line in helper_text[fn_start:].splitlines(keepends=True):
              depth += line.count('{') - line.count('}')
              pos += len(line)
              if depth == 0:
                  end = pos
                  break
          if end is None:
              raise SystemExit('could not find end of ensure_hf_tools_venv')

          replacement = '''# -------- venv bootstrap (LAN-friendly) --------
          _hff_is_home_network() {
            case "${HFF_ENVIRONMENT:-}" in
              home|local) return 0 ;;
              pod|remote) return 1 ;;
            esac

            local fqdn domains
            fqdn="$(hostname -f 2>/dev/null || true)"
            domains="$(
              {
                grep -hE '^[[:space:]]*(search|domain)[[:space:]]+' /etc/resolv.conf 2>/dev/null || true
                command -v resolvectl >/dev/null 2>&1 && resolvectl domain 2>/dev/null || true
              } | tr '\\n' ' '
            )"
            [[ "$fqdn" == *.home.arpa ]] || [[ "$domains" == *home.arpa* ]]
          }

          ensure_hf_tools_venv() {
            local venv="${HFF_VENV}"
            local py="${PYTHON:-python3}"
            local hub_spec install_mode installed_version copy_support

            if [[ ! -x "$venv/bin/python" ]]; then
              _hff_info "Creating venv: $venv"
              mkdir -p "$(dirname "$venv")" || true
              "$py" -m venv "$venv" || return 1
            fi

            export HFF_VENV="$venv"
            "$venv/bin/python" -m pip install -U pip >/dev/null || return 1

            if [[ -n "${HFF_HUB_VER:-}" ]]; then
              hub_spec="huggingface-hub==${HFF_HUB_VER}"
              install_mode="explicit pin"
            elif [[ "${HFF_PINNED:-0}" == "1" ]]; then
              HFF_HUB_VER="1.3.1"
              hub_spec="huggingface-hub==${HFF_HUB_VER}"
              install_mode="pod-compatible pin"
            elif _hff_is_home_network; then
              hub_spec="huggingface-hub"
              install_mode="latest stable (home/local)"
            else
              HFF_HUB_VER="1.3.1"
              hub_spec="huggingface-hub==${HFF_HUB_VER}"
              install_mode="conservative fallback"
            fi

            : "${HFF_XFER_VER:=0.1.9}"
            "$venv/bin/python" -m pip install -U \\
              "$hub_spec" \\
              "hf-transfer==${HFF_XFER_VER}" >/dev/null || return 1

            installed_version="$(
              "$venv/bin/python" -c 'import huggingface_hub; print(huggingface_hub.__version__)'
            )" || return 1
            copy_support="$(
              "$venv/bin/python" -c 'from huggingface_hub import HfApi; print("yes" if callable(getattr(HfApi(), "copy_files", None)) else "no")'
            )" || return 1

            _hff_info "Ready: $venv"
            _hff_info "huggingface-hub: ${installed_version} (${install_mode})"
            _hff_info "Server-side repo copy support: ${copy_support}"
          }
          '''
          helper_text = helper_text[:start] + replacement + helper_text[end:]
          helper.write_text(helper_text, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python3 -m pip install -q 'huggingface-hub>=1.24.0'
          python3 -m py_compile bin/hff.py
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('hff', 'bin/hff.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.parse_hf_uri('hf://datasets/a/b/file.bin') == ('a/b', 'dataset', 'file.bin', False)
          assert mod.parse_hf_uri('hf://a/b/folder/') == ('a/b', 'model', 'folder', True)
          assert mod.make_hf_uri('x/y', 'dataset', 'p/f') == 'hf://datasets/x/y/p/f'
          assert mod.make_hf_uri('x/y', 'model', 'p/f') == 'hf://x/y/p/f'
          args = mod.build_parser().parse_args(['--repo','x/y','--type','dataset','cp','--local','hf://datasets/a/b/file.bin','dest/'])
          assert args.local_transfer is True
          assert callable(getattr(mod.HfApi(), 'copy_files', None))
          PY
          bash -n helpers_shell.sh

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-hff-capability-aware-cp.yml
          rm -f .github/workflows/fix-hff-patch-workflow.yml
          rm -f .github/workflows/retry-fix-hff-patch.yml
          rm -f .github/workflows/finalize-hff-capability-aware-cp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/hff.py helpers_shell.sh .github/workflows
          git commit -m "Make hff cp capability-aware with local fallback"
          git push origin main
