name: Patch hff remote cp

on:
  push:
    paths:
      - .github/workflows/patch-hff-remote-cp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch hff.py
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/hff.py")
          text = path.read_text(encoding="utf-8")

          helper_anchor = '''def has_glob(s: str) -> bool:
              # minimal glob detection (shell-style)
              return any(ch in s for ch in ["*", "?", "["])
          '''
          helper_replacement = helper_anchor + '''

          def parse_hf_uri(uri: str):
              """Parse hf://<models|datasets>/<owner>/<repo>/<path> sources."""
              raw = (uri or "").strip()
              if not raw.startswith("hf://"):
                  return None

              parts = raw[5:].split("/")
              if len(parts) < 4:
                  die(
                      "cp: invalid Hugging Face URI; expected "
                      "hf://datasets/OWNER/REPO/path or hf://models/OWNER/REPO/path",
                      1,
                  )

              kind, owner, repo_name = parts[:3]
              filename = normalize_path("/".join(parts[3:]))
              type_map = {
                  "dataset": "dataset",
                  "datasets": "dataset",
                  "model": "model",
                  "models": "model",
              }
              repo_type = type_map.get(kind.lower())
              if not repo_type:
                  die(f"cp: unsupported Hugging Face URI repo type: {kind}", 1)
              if not owner or not repo_name or not filename:
                  die("cp: Hugging Face URI is missing owner, repo, or file path", 1)
              if has_glob(filename) or has_trailing_slash(raw):
                  die("cp: remote hf:// sources must name one file (no glob or directory source)", 1)

              return f"{owner}/{repo_name}", repo_type, filename
          '''
          if "def parse_hf_uri(" not in text:
              if helper_anchor not in text:
                  raise SystemExit("helper anchor not found")
              text = text.replace(helper_anchor, helper_replacement, 1)

          cp_anchor = '''def cmd_get(args) -> None:
          '''
          cp_impl = '''def cmd_cp(args) -> None:
              """Copy a local file or one hf:// remote file into the configured repo."""
              src_raw = (args.src or "").strip()
              if not src_raw:
                  die("cp: src required")

              remote = parse_hf_uri(src_raw)
              if remote is None:
                  # Preserve existing local upload behavior.
                  args.local = [src_raw]
                  return cmd_put(args)

              tok = need_token()
              source_repo, source_type, source_file = remote

              dst_arg = (args.dst or "").strip()
              dst_is_dir = has_trailing_slash(dst_arg)
              dst_raw = normalize_path(dst_arg)
              if not dst_raw:
                  die("cp: dst required")

              if dst_is_dir:
                  dst = f"{dst_raw}/{Path(source_file).name}"
              else:
                  dst = dst_raw

              a = api(tok)
              destination_files = set(list_files(a, args.repo, args.type))
              if dst_is_dir and dst_raw in destination_files:
                  die(f"cp: destination is an existing file, not a directory: {dst_raw}", 1)

              target_dir = dst_raw if dst_is_dir else parent_dir(dst)
              if target_dir:
                  ops = ensure_dir_ops(destination_files, target_dir)
                  if ops:
                      a.create_commit(
                          repo_id=args.repo,
                          repo_type=args.type,
                          operations=ops,
                          commit_message=f"mkdir {target_dir}",
                      )

              try:
                  cached = _hf_download(
                      source_repo,
                      source_type,
                      source_file,
                      tok,
                      cache_dir=args.cache_dir or None,
                  )
              except Exception as e:
                  die(f"cp: download failed for {src_raw}: {e}", 1)

              try:
                  a.upload_file(
                      path_or_fileobj=str(cached),
                      path_in_repo=dst,
                      repo_id=args.repo,
                      repo_type=args.type,
                      commit_message=args.message or f"cp {src_raw} -> {dst}",
                  )
              except Exception as e:
                  die(f"cp: upload failed to {dst}: {e}", 1)

              print("ok")


          def cmd_get(args) -> None:
          '''
          if "def cmd_cp(" not in text:
              if cp_anchor not in text:
                  raise SystemExit("cmd_get anchor not found")
              text = text.replace(cp_anchor, cp_impl, 1)

          parser_anchor = '''    sp = sub.add_parser("get")
              sp.add_argument("src")
          '''
          parser_impl = '''    sp = sub.add_parser("cp")
              sp.add_argument("src", help="local file or hf://<models|datasets>/OWNER/REPO/path")
              sp.add_argument("dst")
              sp.add_argument("-m", "--message", default="")
              sp.add_argument("--cache-dir", default="")
              sp.set_defaults(fn=cmd_cp)

              sp = sub.add_parser("get")
              sp.add_argument("src")
          '''
          if 'sub.add_parser("cp")' not in text:
              if parser_anchor not in text:
                  raise SystemExit("parser anchor not found")
              text = text.replace(parser_anchor, parser_impl, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          python3 -m py_compile bin/hff.py
          python3 -m pip install -q 'huggingface_hub>=0.36,<1'
          python3 - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location("hff", "bin/hff.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.parse_hf_uri(
              "hf://datasets/SOURCE_USERNAME/SOURCE_DATASET_REPO/model.safetensors"
          ) == (
              "SOURCE_USERNAME/SOURCE_DATASET_REPO",
              "dataset",
              "model.safetensors",
          )

          args = module.build_parser().parse_args([
              "--repo", "destination/repo",
              "--type", "dataset",
              "cp",
              "hf://datasets/source/repo/model.safetensors",
              "models/diffusion_models/",
          ])
          assert args.fn is module.cmd_cp
          assert args.dst == "models/diffusion_models/"
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-hff-remote-cp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/hff.py .github/workflows/patch-hff-remote-cp.yml
          git commit -m "Add cross-repository hf source support to hff cp"
          git push origin main
