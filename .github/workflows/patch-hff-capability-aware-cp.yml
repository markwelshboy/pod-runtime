name: Patch capability-aware hff cp

on:
  push:
    paths:
      - .github/workflows/patch-hff-capability-aware-cp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch hff command and venv bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hff = Path("bin/hff.py")
          text = hff.read_text(encoding="utf-8")

          old_parser = '''def parse_hf_uri(uri: str):
              """Parse hf://<models|datasets>/<owner>/<repo>/<path> sources."""
              raw = (uri or "").strip()
              if not raw.startswith("hf://"):
                  return None

              parts = raw[5:].split("/")
              if len(parts) < 4:
                  die(
                      "cp: invalid Hugging Face URI; expected "
                      "hf://datasets/OWNER/REPO/path or hf://models/OWNER/REPO/path",
                      1,
                  )

              kind, owner, repo_name = parts[:3]
              filename = normalize_path("/".join(parts[3:]))
              type_map = {
                  "dataset": "dataset",
                  "datasets": "dataset",
                  "model": "model",
                  "models": "model",
              }
              repo_type = type_map.get(kind.lower())
              if not repo_type:
                  die(f"cp: unsupported Hugging Face URI repo type: {kind}", 1)
              if not owner or not repo_name or not filename:
                  die("cp: Hugging Face URI is missing owner, repo, or file path", 1)
              if has_glob(filename) or has_trailing_slash(raw):
                  die("cp: remote hf:// sources must name one file (no glob or directory source)", 1)

              return f"{owner}/{repo_name}", repo_type, filename
          '''

          new_parser = '''def parse_hf_uri(uri: str):
              """Parse an hf:// repository URI while preserving directory intent."""
              raw = (uri or "").strip()
              if not raw.startswith("hf://"):
                  return None

              parts = raw[5:].split("/")
              if len(parts) < 3:
                  die(
                      "cp: invalid Hugging Face URI; expected "
                      "hf://datasets/OWNER/REPO/path or hf://OWNER/REPO/path",
                      1,
                  )

              first = parts[0].lower()
              if first in {"dataset", "datasets", "model", "models"}:
                  if len(parts) < 4:
                      die("cp: Hugging Face URI is missing owner, repo, or path", 1)
                  repo_type = "dataset" if first in {"dataset", "datasets"} else "model"
                  owner, repo_name = parts[1:3]
                  path_parts = parts[3:]
              else:
                  repo_type = "model"
                  owner, repo_name = parts[:2]
                  path_parts = parts[2:]

              path_in_repo = normalize_path("/".join(path_parts))
              if not owner or not repo_name or not path_in_repo:
                  die("cp: Hugging Face URI is missing owner, repo, or file path", 1)
              if has_glob(path_in_repo):
                  die("cp: hf:// sources do not support globs", 1)

              return f"{owner}/{repo_name}", repo_type, path_in_repo, has_trailing_slash(raw)


          def make_hf_uri(repo: str, repo_type: str, path: str, trailing_slash: bool = False) -> str:
              prefix = "hf://datasets" if repo_type == "dataset" else "hf://"
              separator = "/" if prefix.endswith("://") else "/"
              uri = f"{prefix}{separator}{repo}/{normalize_path(path)}"
              if trailing_slash and not uri.endswith("/"):
                  uri += "/"
              return uri


          def supports_server_side_copy(api_: HfApi) -> bool:
              return callable(getattr(api_, "copy_files", None))
          '''

          if old_parser not in text:
              raise SystemExit("parse_hf_uri block not found")
          text = text.replace(old_parser, new_parser, 1)

          start = text.index("def cmd_cp(args) -> None:\n")
          end = text.index("\n\ndef cmd_get(args) -> None:\n", start)
          old_cp = text[start:end]
          new_cp = '''def cmd_cp(args) -> None:
              """Copy a local file or an hf:// source into the configured repository."""
              src_raw = (args.src or "").strip()
              if not src_raw:
                  die("cp: src required")

              remote = parse_hf_uri(src_raw)
              if remote is None:
                  args.local = [src_raw]
                  return cmd_put(args)

              tok = need_token()
              source_repo, source_type, source_path, source_is_dir = remote

              dst_arg = (args.dst or "").strip()
              dst_is_dir = has_trailing_slash(dst_arg)
              dst_path = normalize_path(dst_arg)
              if not dst_path:
                  die("cp: dst required")

              if source_is_dir:
                  destination_path = dst_path
                  destination_is_dir = dst_is_dir
              elif dst_is_dir:
                  destination_path = f"{dst_path}/{Path(source_path).name}"
                  destination_is_dir = False
              else:
                  destination_path = dst_path
                  destination_is_dir = False

              destination_uri = make_hf_uri(
                  args.repo,
                  args.type,
                  destination_path,
                  trailing_slash=destination_is_dir,
              )

              a = api(tok)

              if args.local_transfer:
                  if source_is_dir:
                      die("cp: --local currently supports only single-file hf:// sources", 1)

                  print(f"[hff] Local transfer: {src_raw} -> {destination_uri}", file=sys.stderr)
                  try:
                      cached = _hf_download(
                          source_repo,
                          source_type,
                          source_path,
                          tok,
                          cache_dir=args.cache_dir or None,
                      )
                  except Exception as e:
                      die(f"cp: local download failed for {src_raw}: {e}", 1)

                  try:
                      a.upload_file(
                          path_or_fileobj=str(cached),
                          path_in_repo=destination_path,
                          repo_id=args.repo,
                          repo_type=args.type,
                          commit_message=args.message or f"cp {src_raw} -> {destination_path} via local transfer",
                      )
                  except Exception as e:
                      die(f"cp: local upload failed to {destination_uri}: {e}", 1)

                  print(destination_uri)
                  return

              if not supports_server_side_copy(a):
                  try:
                      import huggingface_hub
                      version = getattr(huggingface_hub, "__version__", "unknown")
                  except Exception:
                      version = "unknown"
                  die(
                      "cp: server-side repository copy is unavailable with "
                      f"huggingface-hub {version}. Re-run with --local for a single-file "
                      "download/upload transfer.",
                      1,
                  )

              try:
                  a.copy_files(src_raw, destination_uri)
              except Exception as e:
                  hint = ""
                  if not source_is_dir:
                      hint = " Re-run with --local to download and upload the file through this machine."
                  die(f"cp: server-side copy failed: {e}.{hint}", 1)

              print(destination_uri)
          '''
          text = text[:start] + new_cp + text[end:]

          old_cli = '''    sp = sub.add_parser("cp")
              sp.add_argument("src", help="local file or hf://<models|datasets>/OWNER/REPO/path")
              sp.add_argument("dst")
              sp.add_argument("-m", "--message", default="")
              sp.add_argument("--cache-dir", default="")
              sp.set_defaults(fn=cmd_cp)
          '''
          new_cli = '''    sp = sub.add_parser("cp")
              sp.add_argument("src", help="local file or hf:// repository URI")
              sp.add_argument("dst")
              sp.add_argument("-m", "--message", default="")
              sp.add_argument("--cache-dir", default="")
              sp.add_argument(
                  "--local",
                  dest="local_transfer",
                  action="store_true",
                  help="for one hf:// file, download then upload instead of using server-side copy",
              )
              sp.set_defaults(fn=cmd_cp)
          '''
          if old_cli not in text:
              raise SystemExit("cp CLI block not found")
          text = text.replace(old_cli, new_cli, 1)
          hff.write_text(text, encoding="utf-8")

          old_venv = '''# -------- venv bootstrap (LAN-friendly) --------
          ensure_hf_tools_venv() {
            local venv="${HFF_VENV}"
            local py="${PYTHON:-python3}"

            if [[ ! -x "$venv/bin/python" ]]; then
              _hff_info "Creating venv: $venv"
              mkdir -p "$(dirname "$venv")" || true
              "$py" -m venv "$venv" || return 1
            fi

            export HFF_VENV="$venv"

            "$venv/bin/python" -m pip install -U pip >/dev/null || return 1

            # Keep it unpinned by default; you can pin by exporting HFF_PINNED=1 + versions below
            if [[ "${HFF_PINNED:-0}" == "1" ]]; then
              : "${HFF_HUB_VER:=1.3.1}"
              : "${HFF_XFER_VER:=0.1.9}"
              "$venv/bin/python" -m pip install -U \\
                "huggingface-hub==${HFF_HUB_VER}" \\
                "hf-transfer==${HFF_XFER_VER}" >/dev/null || return 1
            else
              "$venv/bin/python" -m pip install -U huggingface-hub hf-transfer >/dev/null || return 1
            fi

            _hff_info "Ready: $venv"
          }
          '''

          new_venv = '''# -------- venv bootstrap (LAN-friendly) --------
          _hff_is_home_network() {
            case "${HFF_ENVIRONMENT:-}" in
              home|local) return 0 ;;
              pod|remote) return 1 ;;
            esac

            local fqdn domains
            fqdn="$(hostname -f 2>/dev/null || true)"
            domains="$(
              {
                grep -hE '^[[:space:]]*(search|domain)[[:space:]]+' /etc/resolv.conf 2>/dev/null || true
                command -v resolvectl >/dev/null 2>&1 && resolvectl domain 2>/dev/null || true
              } | tr '\\n' ' '
            )"

            [[ "$fqdn" == *.home.arpa ]] || [[ "$domains" == *home.arpa* ]]
          }

          ensure_hf_tools_venv() {
            local venv="${HFF_VENV}"
            local py="${PYTHON:-python3}"
            local hub_spec install_mode installed_version copy_support

            if [[ ! -x "$venv/bin/python" ]]; then
              _hff_info "Creating venv: $venv"
              mkdir -p "$(dirname "$venv")" || true
              "$py" -m venv "$venv" || return 1
            fi

            export HFF_VENV="$venv"
            "$venv/bin/python" -m pip install -U pip >/dev/null || return 1

            if [[ -n "${HFF_HUB_VER:-}" ]]; then
              hub_spec="huggingface-hub==${HFF_HUB_VER}"
              install_mode="explicit pin"
            elif [[ "${HFF_PINNED:-0}" == "1" ]]; then
              HFF_HUB_VER="1.3.1"
              hub_spec="huggingface-hub==${HFF_HUB_VER}"
              install_mode="pod-compatible pin"
            elif _hff_is_home_network; then
              hub_spec="huggingface-hub"
              install_mode="latest stable (home/local)"
            else
              HFF_HUB_VER="1.3.1"
              hub_spec="huggingface-hub==${HFF_HUB_VER}"
              install_mode="conservative fallback"
            fi

            : "${HFF_XFER_VER:=0.1.9}"
            "$venv/bin/python" -m pip install -U \\
              "$hub_spec" \\
              "hf-transfer==${HFF_XFER_VER}" >/dev/null || return 1

            installed_version="$(
              "$venv/bin/python" -c 'import huggingface_hub; print(huggingface_hub.__version__)'
            )" || return 1
            copy_support="$(
              "$venv/bin/python" -c 'from huggingface_hub import HfApi; print("yes" if callable(getattr(HfApi(), "copy_files", None)) else "no")'
            )" || return 1

            _hff_info "Ready: $venv"
            _hff_info "huggingface-hub: ${installed_version} (${install_mode})"
            _hff_info "Server-side repo copy support: ${copy_support}"
          }
          '''

          candidates = []
          for path in Path(".").rglob("*.sh"):
              data = path.read_text(encoding="utf-8", errors="ignore")
              if "ensure_hf_tools_venv()" in data:
                  candidates.append(path)
          if len(candidates) != 1:
              raise SystemExit(f"expected one ensure_hf_tools_venv definition, found: {candidates}")

          helper = candidates[0]
          helper_text = helper.read_text(encoding="utf-8")
          if old_venv not in helper_text:
              raise SystemExit(f"venv bootstrap block not found in {helper}")
          helper.write_text(helper_text.replace(old_venv, new_venv, 1), encoding="utf-8")
          print(f"Patched venv bootstrap in {helper}")
          PY

      - name: Validate
        shell: bash
        run: |
          python3 -m pip install -q 'huggingface-hub>=1.24.0'
          python3 -m py_compile bin/hff.py
          python3 - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location("hff", "bin/hff.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.parse_hf_uri(
              "hf://datasets/SOURCE_USERNAME/SOURCE_DATASET_REPO/model.safetensors"
          ) == (
              "SOURCE_USERNAME/SOURCE_DATASET_REPO",
              "dataset",
              "model.safetensors",
              False,
          )
          assert module.parse_hf_uri(
              "hf://datasets/SOURCE_USERNAME/SOURCE_DATASET_REPO/model_folder/"
          )[-1] is True
          assert module.parse_hf_uri("hf://owner/model/file.bin") == (
              "owner/model", "model", "file.bin", False
          )
          assert module.make_hf_uri("owner/dataset", "dataset", "models/file.bin") == (
              "hf://datasets/owner/dataset/models/file.bin"
          )
          assert module.make_hf_uri("owner/model", "model", "models/file.bin") == (
              "hf://owner/model/models/file.bin"
          )

          args = module.build_parser().parse_args([
              "--repo", "destination/repo",
              "--type", "dataset",
              "cp", "--local",
              "hf://datasets/source/repo/model.safetensors",
              "models/diffusion_models/",
          ])
          assert args.fn is module.cmd_cp
          assert args.local_transfer is True
          PY
          bash -n helpers*.sh

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-hff-capability-aware-cp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/hff.py helpers*.sh .github/workflows/patch-hff-capability-aware-cp.yml
          git commit -m "Make hff cp capability-aware with local fallback"
          git push origin main
