name: HF manifest downloader tests

on:
  workflow_dispatch:
  push:
    paths:
      - helpers.sh
      - helpers_hf_manifest.sh
      - helpers_hf_manifest_selection.sh
      - helpers_hf_manifest_tree.sh
      - helpers_hf_manifest.d/**
      - bin/hf_manifest_expand.py
      - tests/test_hf_manifest_expand.py
      - start.sh
      - .github/workflows/hf-manifest-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Check shell syntax
        run: bash -n helpers.sh helpers_hf_manifest.sh helpers_hf_manifest_selection.sh helpers_hf_manifest_tree.sh helpers_hf_manifest.d/*.sh start.sh

      - name: Test explicit selection, background downloads, and status
        shell: bash
        run: |
          set -euo pipefail

          helpers_human_bytes() { printf '%s B\n' "$1"; }
          helpers_have_aria2_rpc() { return 1; }
          helpers_queue_empty() { return 0; }
          aria2_download_from_manifest() { echo ARIA2_ORIGINAL; }
          aria2_show_download_snapshot() { :; }
          aria2_monitor_progress() { :; }

          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/hff/bin"
          ln -s "$(command -v python3)" "$test_root/hff/bin/python"

          cat > "$test_root/hff/bin/hf" <<'HF'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$1" == download ]]
          repo="$2"
          file="$3"
          shift 3
          local_dir=""
          while (($#)); do
            case "$1" in
              --local-dir) local_dir="$2"; shift 2 ;;
              --revision|--repo-type) shift 2 ;;
              --quiet) shift ;;
              *) shift ;;
            esac
          done
          mkdir -p "$local_dir/$(dirname "$file")"
          : > "$local_dir/$file"
          for _ in 1 2 3 4; do
            head -c 16384 /dev/zero >> "$local_dir/$file"
            sleep 0.15
          done
          printf '%s\n' "$local_dir/$file"
          HF
          chmod +x "$test_root/hff/bin/hf"

          export HFF_VENV="$test_root/hff"
          export COMFY_LOGS="$test_root/logs"
          source ./helpers_hf_manifest.sh

          HF_DOWNLOADER=false aria2_download_from_manifest | grep -q ARIA2_ORIGINAL

          head -c 65536 /dev/zero > "$test_root/source.bin"
          cat > "$test_root/generic.json" <<JSON
          {
            "sections": {
              "test_base": [
                {"url":"file://$test_root/source.bin","path":"$test_root/generic-out.bin","bytes":65536}
              ],
              "test_loras": []
            }
          }
          JSON

          [[ "$(hf_manifest_sections_for_families "$test_root/generic.json" test base)" == "test_base" ]]
          [[ "$(hf_manifest_sections_for_families "$test_root/generic.json" test loras)" == "test_loras" ]]
          if hf_manifest_sections_for_families "$test_root/generic.json" missing base >/dev/null 2>&1; then
            echo "missing family unexpectedly resolved" >&2
            exit 1
          fi

          export HF_DOWNLOADER=true
          hf_download_from_manifest "$test_root/generic.json" "$test_root/generic-state" "test_base"
          hf_download_wait "$test_root/generic-state"
          generic_status="$(hf_download_status_json "$test_root/generic-state")"
          jq -e '.completed == 1 and .failed == 0 and .percent == 100' <<<"$generic_status" >/dev/null
          cmp "$test_root/source.bin" "$test_root/generic-out.bin"

          # Old download_<section> aliases must not select a section anymore.
          export download_test_base=true
          hf_download_from_manifest "$test_root/generic.json" "$test_root/legacy-state" ""
          legacy_status="$(hf_download_status_json "$test_root/legacy-state")"
          jq -e '.total == 0 and .completed == 0 and .failed == 0' <<<"$legacy_status" >/dev/null
          unset download_test_base

          cat > "$test_root/hf.json" <<JSON
          {"sections":{"test_base":[{"url":"https://huggingface.co/acme/demo/resolve/main/models/fake.bin","path":"$test_root/hf-out.bin","bytes":65536}]}}
          JSON
          hf_download_from_manifest "$test_root/hf.json" "$test_root/hf-state" "test_base"
          sleep 0.30
          live_status="$(hf_download_status_json "$test_root/hf-state")"
          jq -e '.running == 1 and .items[0].observed_bytes > 0 and .items[0].observed_bytes < .items[0].total_bytes' <<<"$live_status" >/dev/null
          hf_download_wait "$test_root/hf-state"
          final_status="$(hf_download_status_json "$test_root/hf-state")"
          jq -e '.completed == 1 and .failed == 0 and .percent == 100' <<<"$final_status" >/dev/null
          [[ "$(stat -c %s "$test_root/hf-out.bin")" -eq 65536 ]]

          # HTTP URLs may percent-encode repository filenames; hf download must
          # receive the decoded repo path. This mirrors the real NO8D/Krea2 case.
          cat > "$test_root/encoded.json" <<JSON
          {"sections":{"encoded_base":[{"url":"https://huggingface.co/NO8D/HighResolution/resolve/main/high%20quality%20for%20Krea2.safetensors","path":"$test_root/high-quality-krea2.safetensors","bytes":65536}]}}
          JSON
          hf_download_from_manifest "$test_root/encoded.json" "$test_root/encoded-state" "encoded_base"
          hf_download_wait "$test_root/encoded-state"
          encoded_status="$(hf_download_status_json "$test_root/encoded-state")"
          jq -e '.completed == 1 and .failed == 0 and .percent == 100' <<<"$encoded_status" >/dev/null
          encoded_log="$(jq -r '.items[0].log' <<<"$encoded_status")"
          grep -Fq '/work/0001/high quality for Krea2.safetensors' "$encoded_log"
