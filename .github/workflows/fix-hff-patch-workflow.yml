name: Fix hff patch workflow

on:
  push:
    paths:
      - .github/workflows/fix-hff-patch-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct URI builder and retrigger patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-hff-capability-aware-cp.yml')
          text = path.read_text(encoding='utf-8')
          old = '''              prefix = "hf://datasets" if repo_type == "dataset" else "hf://"
              separator = "/" if prefix.endswith("://") else "/"
              uri = f"{prefix}{separator}{repo}/{normalize_path(path)}"
          '''
          new = '''              prefix = "hf://datasets/" if repo_type == "dataset" else "hf://"
              uri = f"{prefix}{repo}/{normalize_path(path)}"
          '''
          if old not in text:
              raise SystemExit('URI builder block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-hff-patch-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-hff-capability-aware-cp.yml .github/workflows/fix-hff-patch-workflow.yml
          git commit -m "Fix hff destination URI construction"
          git push origin main
