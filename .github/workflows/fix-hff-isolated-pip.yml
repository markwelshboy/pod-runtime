name: Fix isolated HFF pip bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        shell: bash
        run: |
          echo '' | base64 -d | python3
          bash -n helpers_shell.sh
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-hff-isolated-pip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add helpers_shell.sh .github/workflows/fix-hff-isolated-pip.yml
          git commit -m 'Isolate HFF venv installs from stack pip constraints'
          git push origin main
