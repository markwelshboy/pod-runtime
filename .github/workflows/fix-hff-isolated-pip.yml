# Triggered patch workflow; removes itself after success.
name: Fix isolated HFF pip bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-hff-isolated-pip.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch isolated HFF pip handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('helpers_shell.sh')
          text = path.read_text(encoding='utf-8')

          marker = '''_hff_err()  { echo "[hff] ERROR: $*" >&2; }

# -------- venv bootstrap (LAN-friendly) --------
'''
          replacement = '''_hff_err()  { echo "[hff] ERROR: $*" >&2; }

_hff_pip() {
  # The HFF venv is intentionally isolated from ComfyUI's global pip pins.
  # Ignore PIP_CONSTRAINT/PIP_BUILD_CONSTRAINT and /etc/pip.conf for this venv only.
  env \\
    -u PIP_CONSTRAINT \\
    -u PIP_BUILD_CONSTRAINT \\
    PIP_CONFIG_FILE=/dev/null \\
    "${HFF_VENV}/bin/python" -m pip "$@"
}

# -------- venv bootstrap (LAN-friendly) --------
'''
          if marker not in text:
              raise SystemExit('bootstrap marker not found')
          text = text.replace(marker, replacement, 1)

          old = '''  export HFF_VENV="$venv"
  "$venv/bin/python" -m pip install -U pip >/dev/null || return 1
'''
          new = '''  export HFF_VENV="$venv"
  _hff_pip install -U pip >/dev/null || return 1
'''
          if old not in text:
              raise SystemExit('pip upgrade block not found')
          text = text.replace(old, new, 1)

          old = '''  : "${HFF_XFER_VER:=0.1.9}"
  "$venv/bin/python" -m pip install -U \\
    "$hub_spec" \\
    "hf-transfer==${HFF_XFER_VER}" >/dev/null || return 1
'''
          new = '''  _hff_pip install -U "$hub_spec" >/dev/null || return 1
'''
          if old not in text:
              raise SystemExit('hub install block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          bash -n helpers_shell.sh
          grep -F '_hff_pip install -U pip' helpers_shell.sh
          grep -F '_hff_pip install -U "$hub_spec"' helpers_shell.sh
          ! grep -A5 -F '_hff_pip install -U "$hub_spec"' helpers_shell.sh | grep -F 'hf-transfer=='

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-hff-isolated-pip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helpers_shell.sh .github/workflows/fix-hff-isolated-pip.yml
          git commit -m "Isolate HFF venv installs from stack pip constraints"
          git push origin main
